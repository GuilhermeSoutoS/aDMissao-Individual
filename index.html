<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Portal da Igreja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container-pagina">
    <section class="cartao">

      <div class="logotipo">
        <img src="assets/logo-ad-missao.png" alt="Logo AD Missão no Brasil">
      </div>

      <p class="rotulo-superior">Assembleia de Deus</p>
      <h1>Seja bem-vindo(a)</h1>

      <form class="formulario" novalidate>
        <label class="campo">
          <span class="rotulo-campo">E-mail</span>
          <input type="email" name="email" placeholder="seunome@email.com" autocomplete="email" required>
        </label>

        <label class="campo">
          <span class="rotulo-campo">Senha</span>
          <input type="password" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
        </label>

        <button type="submit" class="botao">Entrar</button>
      </form>

      <p class="texto-rodape">Ainda não tem cadastro? <a href="cadastro.html" class="link">Cadastre-se</a></p>

    </section>

   
  </main>

</body>
</html>
