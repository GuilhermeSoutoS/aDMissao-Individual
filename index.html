<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Portal da Igreja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="wrap">
    <section class="card">

      

      <p class="eyebrow">Assembleia&nbsp;de&nbsp;Deus</p>
      <h1>Seja bem-vindo(a)</h1>

      <form class="form" novalidate>
        <label class="field">
          <span class="field-label">E-mail</span>
          <input type="email" name="email" placeholder="seunome@email.com" autocomplete="email" required>
        </label>

        <label class="field">
          <span class="field-label">Senha</span>
          <input type="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
        </label>

        <div class="row">
          <a href="#" class="link">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>

      <p class="footer-text">Ainda não tem cadastro? <a href="#" class="link">Clique aqui</a></p>

    </section>

    <p class="page-footer">Portal do Membro &middot; Igreja Evangélica Assembleia de Deus</p>
  </main>

</body>
</html>
