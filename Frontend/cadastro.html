<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Membro | Portal da Igreja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container-pagina container-pagina--largo">
    <section class="cartao cartao--largo">

      <div class="logotipo logotipo--pequeno">
        <img src="assets/logo-ad-missao.png" alt="Logo AD Missão no Brasil">
      </div>

      <p class="rotulo-superior">Assembleia de Deus AD Missão</p>
      <h1>Cadastro de membro</h1>

      <form class="formulario" id="formulario-cadastro" novalidate>

        <div class="grade-formulario">

          <label class="campo campo-largura-total">
            <span class="rotulo-campo">Nome completo</span>
            <input type="text" id="nome" name="nome" placeholder="Nome e sobrenome" autocomplete="name">
            <span class="mensagem-erro" id="erro-nome"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">CPF</span>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="11">
            <span class="mensagem-erro" id="erro-cpf"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">RG</span>
            <input type="text" id="rg" name="rg" placeholder="00.000.000-0" maxlength="15">
            <span class="mensagem-erro" id="erro-rg"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">Data de nascimento</span>
            <input type="date" id="dataNascimento" name="dataNascimento">
            <span class="mensagem-erro" id="erro-dataNascimento"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">Cargo na igreja</span>
            <select id="cargo" name="cargo">
              <option value="" selected disabled>Selecione um cargo</option>

            </select>
            <span class="mensagem-erro" id="erro-cargo"></span>
          </label>

          <p class="secao-titulo campo-largura-total">Endereço</p>

          <label class="campo">
            <span class="rotulo-campo">CEP</span>
            <input type="text" id="cep" name="cep" placeholder="00000-000" inputmode="numeric" maxlength="8">
            <span class="mensagem-erro" id="erro-cep"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">Estado</span>
            <select id="estado" name="estado">
              <option value="" selected disabled>UF</option>

            </select>
            <span class="mensagem-erro" id="erro-estado"></span>
          </label>

          <label class="campo campo-largura-total">
            <span class="rotulo-campo">Rua</span>
            <input type="text" id="rua" name="rua" placeholder="Nome da rua" autocomplete="address-line1">
            <span class="mensagem-erro" id="erro-rua"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">Número</span>
            <input type="number" id="numero" name="numero" placeholder="0000">
            <span class="mensagem-erro" id="erro-numero"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">Complemento</span>
            <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco... (opcional)">
          </label>

          <label class="campo">
            <span class="rotulo-campo">Bairro</span>
            <input type="text" id="bairro" name="bairro" placeholder="Bairro">
            <span class="mensagem-erro" id="erro-bairro"></span>
          </label>

          <label class="campo">
            <span class="rotulo-campo">Cidade</span>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade">
            <span class="mensagem-erro" id="erro-cidade"></span>
          </label>

          <p class="secao-titulo campo-largura-total">Contato e dados pessoais</p>

          <label class="campo">
            <span class="rotulo-campo">Telefone</span>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric"
              maxlength="11">
            <span class="mensagem-erro" id="erro-telefone"></span>
          </label>

          <div class="campo">
            <span class="rotulo-campo">Gênero</span>
            <div class="grupo-genero">
              <label class="opcao-genero">
                <input type="radio" id="generoFeminino" name="genero" value="FEMININO">
                <span>Feminino</span>
              </label>

              <label class="opcao-genero">
                <input type="radio" id="generoMasculino" name="genero" value="MASCULINO">
                <span>Masculino</span>
              </label>
            </div>
            <span class="mensagem-erro" id="erro-genero"></span>
          </div>

        </div>

        <button type="submit" class="botao">Concluir cadastro</button>
      </form>

    </section>

    <p class="rodape-pagina">Portal do Membro &middot; Igreja Evangélica Assembleia de Deus</p>
  </main>
</body>

</html>
<script>
  async function carregarCargo() {
    const resposta = await fetch("http://localhost:8080/opcoes/cargos")

    const cargos = await resposta.json();
    const selectCargo = document.getElementById("cargo")

    for (var i = 0; i < cargos.length; i++) {
      const cargo = cargos[i]

      const opcao = document.createElement("option")

      opcao.value = cargo;
      opcao.textContent = cargo;
      selectCargo.appendChild(opcao);
    }
  }

  async function carregarUf() {
    const resposta = await fetch("http://localhost:8080/opcoes/uf")

    const estados = await resposta.json();
    const selectUf = document.getElementById("estado")

    for (var i = 0; i < estados.length; i++) {
      const uf = estados[i];

      const opcao = document.createElement("option");

      opcao.value = uf;
      opcao.textContent = uf;
      selectUf.appendChild(opcao);

    }
  }


document.getElementById("cpf").addEventListener("input", function () {
    this.value = this.value.replace(/[a-zA-Z]/g, "");
});


document.getElementById("cep").addEventListener("input", function () {
    this.value = this.value.replace(/[a-zA-Z]/g, "");
});


document.getElementById("telefone").addEventListener("input", function () {
    this.value = this.value.replace(/[a-zA-Z]/g, "");
});

document.getElementById("rg").addEventListener("input", function () {
    this.value = this.value.replace(/[a-zA-Z]/g, "");
});

  async function cadastrar() {



    event.preventDefault();


    document.querySelectorAll(".mensagem-erro").forEach(function (elemento) {
      elemento.textContent = "";
    });

    var valido = true;

    var genero;

    const feminino = document.getElementById("generoFeminino");
    const masculino = document.getElementById("generoMasculino");

    if (feminino.checked) {
      genero = "FEMININO";
    } else if (masculino.checked) {
      genero = "MASCULINO";
    }

    var nome = document.getElementById("nome").value
    var cpf = document.getElementById("cpf").value
    var rg = document.getElementById("rg").value
    var dataNascimento = document.getElementById("dataNascimento").value
    var cargo = document.getElementById("cargo").value
    var telefone = document.getElementById("telefone").value
    var cep = document.getElementById("cep").value
    var uf = document.getElementById("estado").value
    var rua = document.getElementById("rua").value
    var numero = document.getElementById("numero").value;
    var complemento = document.getElementById("complemento").value
    var bairro = document.getElementById("bairro").value
    var cidade = document.getElementById("cidade").value

    if (nome == "") {
      document.getElementById("erro-nome").textContent =
        "O nome é obrigatório.";
      valido = false;

    } else if (nome.length < 3) {
      document.getElementById("erro-nome").textContent =
        "O nome deve ter pelo menos 3 caracteres.";
      valido = false;
    }

    if (cpf == "") {

      document.getElementById("erro-cpf").textContent =
        "O CPF é obrigatório.";

      valido = false;

    } else if (cpf.length != 11) {

      document.getElementById("erro-cpf").textContent =
        "O CPF deve ter 11 caracteres.";

      valido = false;

    }

    if (rg == "") {
      document.getElementById("erro-rg").textContent =
        "O RG é obrigatório.";
      valido = false;
    }

    if (dataNascimento == "") {

      document.getElementById("erro-dataNascimento").textContent =
        "A data de nascimento é obrigatória.";

      valido = false;

    } else {

      const data = new Date(dataNascimento + "T00:00:00");
      const hoje = new Date();

      hoje.setHours(0, 0, 0, 0);

      if (data > hoje) {
        document.getElementById("erro-dataNascimento").textContent =
          "A data de nascimento não pode ser futura.";

        valido = false;
      }
    }


    if (cargo == "") {
      document.getElementById("erro-cargo").textContent =
        "Selecione um cargo.";
      valido = false;
    }
    if (cep == "") {

      document.getElementById("erro-cep").textContent =
        "O CEP é obrigatório.";

      valido = false;

    } else if (cep.length != 8) {

      document.getElementById("erro-cep").textContent =
        "O CEP deve ter 8 caracteres.";

      valido = false;

    } 

    if (uf == "") {
      document.getElementById("erro-estado").textContent =
        "Selecione um estado.";
      valido = false;
    }

    if (rua == "") {
      document.getElementById("erro-rua").textContent =
        "A rua é obrigatória.";
      valido = false;
    }


    if (numero == "") {

      document.getElementById("erro-numero").textContent =
        "O número é obrigatório.";

      valido = false;

    } else if (Number(numero) <= 0) {

      document.getElementById("erro-numero").textContent =
        "O número deve ser maior que 0.";

      valido = false;
    }

    if (bairro == "") {
      document.getElementById("erro-bairro").textContent =
        "O bairro é obrigatório.";
      valido = false;
    }

    if (cidade == "") {
      document.getElementById("erro-cidade").textContent =
        "A cidade é obrigatória.";
      valido = false;
    }

    if (telefone == "") {

      document.getElementById("erro-telefone").textContent =
        "O telefone é obrigatório.";

      valido = false;

    } else if (telefone.length != 11) {

      document.getElementById("erro-telefone").textContent =
        "O telefone deve ter 11 caracteres.";

      valido = false;

    }


    if (!feminino.checked && !masculino.checked) {

      document.getElementById("erro-genero").textContent =
        "Selecione um gênero.";

      valido = false;
    }

    if (!valido) {
      return;
    }


    const membro = {

      nome: nome,
      cpf: cpf,
      rg: rg,
      dataNascimento: dataNascimento,
      cargo: cargo,
      telefone: telefone,
      genero: genero,

      endereco: {

        cep: cep,
        uf: uf,
        rua: rua,
        numero: Number(numero),
        complemento: document.getElementById("complemento").value.trim(),
        bairro: bairro,
        cidade: cidade
      }

    };

    const resposta = await fetch("http://localhost:8080/membro", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(membro)

    });

    if (resposta.ok) {

      const membroCadastrado = await resposta.json();

      console.log("Cadastrado:", membroCadastrado);

      alert("Membro cadastrado com sucesso!");

      window.location.href = "usuarios.html"

    } else {

      console.log("Erro:", resposta.status);

      alert("Erro ao cadastrar membro!");
    }

  }



  carregarCargo();
  carregarUf()
  document.getElementById("formulario-cadastro").addEventListener("submit", cadastrar);
</script>
